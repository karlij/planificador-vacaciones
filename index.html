<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control y Monitoreo de Vacaciones</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #4682B4;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .controls {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 4px solid var(--secondary-color);
        }

        .kpi-card h3 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .kpi-card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .table-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-active { background-color: #e6f4ea; color: #137333; }
        .badge-pending { background-color: #feefc3; color: #b06000; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Control y Monitoreo de Vacaciones</h1>
    </header>

    <section class="controls">
        <div class="form-group">
            <label for="searchInput">Buscar Trabajador / Ficha</label>
            <input type="text" id="searchInput" placeholder="Escriba para filtrar..." oninput="filterData()">
        </div>

        <div class="form-group">
            <label for="unitFilter">Unidad / Departamento</label>
            <select id="unitFilter" onchange="filterData()">
                <option value="ALL">Todas las Unidades</option>
            </select>
        </div>

        <div class="form-group">
            <label for="statusFilter">Estado</label>
            <select id="statusFilter" onchange="filterData()">
                <option value="ALL">Todos</option>
                <option value="ACTIVO">Activos</option>
                <option value="PENDIENTE">Pendientes</option>
            </select>
        </div>
    </section>

    <section class="kpi-container">
        <div class="kpi-card">
            <h3>Total Trabajadores</h3>
            <p id="kpiTotal">0</p>
        </div>
        <div class="kpi-card">
            <h3>Días Pendientes Totales</h3>
            <p id="kpiPendingDays">0</p>
        </div>
        <div class="kpi-card">
            <h3>Personal de Vacaciones</h3>
            <p id="kpiOnLeave">0</p>
        </div>
    </section>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Ficha</th>
                    <th>Nombre y Apellido</th>
                    <th>Unidad</th>
                    <th>Empresa</th>
                    <th>Días Pendientes</th>
                    <th>Último Periodo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr>
                    <td colspan="7" style="text-align: center;">Cargando datos...</td>
                </tr>
            </tbody>
        </table>
    </section>
</div>

<script>
    let rawData = [];
    let filteredData = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadTxtData();
    });

    async function loadTxtData() {
        const urlsToTry = ['vacaciones_personal.txt', 'Vacaciones%20personal.txt', 'Vacaciones personal.txt'];
        
        for (let url of urlsToTry) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const text = await response.text();
                    if (text.trim().length > 0) {
                        parseTxtData(text);
                        return;
                    }
                }
            } catch (e) {
                console.warn("No se pudo cargar automáticamente:", url);
            }
        }

        document.getElementById('dataTableBody').innerHTML = 
            '<tr><td colspan="7" style="text-align: center; color: red;">No se pudo cargar vacaciones_personal.txt. Asegúrese de ejecutarlo desde un servidor local (Live Server).</td></tr>';
    }

    function parseTxtData(text) {
        const lines = text.split('\n');
        rawData = [];

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (!trimmed) return;

            // Divide las columnas separadas por tabulador (\t) o comas/puntos y comas
            let cols = trimmed.split('\t');
            if (cols.length < 2) {
                cols = trimmed.split(/[,;]+/);
            }

            // Omitir la fila del encabezado si existe en el TXT
            if (cols[0].toLowerCase().includes('ficha') || cols[1]?.toLowerCase().includes('nombre')) {
                return;
            }

            // Mapeo adaptado al orden del archivo TXT original
            if (cols.length >= 3) {
                const ficha = cols[0] ? cols[0].trim() : 'N/A';
                const nombre = cols[1] ? cols[1].trim() : 'N/A';
                const unidad = cols[2] ? cols[2].trim() : 'N/A';
                const empresa = cols[3] ? cols[3].trim() : 'N/A';
                
                // Conversión de campos numéricos / estado
                const dias = cols[4] ? parseInt(cols[4].trim(), 10) || 0 : 0;
                const periodo = cols[5] ? cols[5].trim() : '-';
                const estado = cols[6] ? cols[6].trim().toUpperCase() : (dias > 0 ? 'PENDIENTE' : 'ACTIVO');

                rawData.push({
                    ficha: ficha,
                    nombre: nombre,
                    unidad: unidad,
                    empresa: empresa,
                    diasPendientes: dias,
                    periodo: periodo,
                    estado: estado
                });
            }
        });

        populateUnitDropdown();
        filteredData = [...rawData];
        renderAll();
    }

    function populateUnitDropdown() {
        const unitSelect = document.getElementById('unitFilter');
        unitSelect.innerHTML = '<option value="ALL">Todas las Unidades</option>';
        
        // Extraer unidades únicas del archivo TXT
        const units = [...new Set(rawData.map(item => item.unidad))].sort();

        units.forEach(unit => {
            if (unit && unit !== 'N/A') {
                const option = document.createElement('option');
                option.value = unit;
                option.textContent = unit;
                unitSelect.appendChild(option);
            }
        });
    }

    function filterData() {
        const searchValue = document.getElementById('searchInput').value.toLowerCase();
        const selectedUnit = document.getElementById('unitFilter').value;
        const statusValue = document.getElementById('statusFilter').value;

        filteredData = rawData.filter(item => {
            const matchesSearch = item.nombre.toLowerCase().includes(searchValue) || 
                                  item.ficha.toLowerCase().includes(searchValue) ||
                                  item.empresa.toLowerCase().includes(searchValue);
            
            const matchesUnit = (selectedUnit === 'ALL') || (item.unidad === selectedUnit);
            const matchesStatus = (statusValue === 'ALL') || (item.estado === statusValue);

            return matchesSearch && matchesUnit && matchesStatus;
        });

        renderAll();
    }

    function renderAll() {
        renderKPIs();
        renderTable();
    }

    function renderKPIs() {
        const total = filteredData.length;
        const totalPendingDays = filteredData.reduce((acc, curr) => acc + curr.diasPendientes, 0);
        const onLeave = filteredData.filter(item => item.estado === 'VACACIONES' || item.estado === 'INACTIVO').length;

        document.getElementById('kpiTotal').textContent = total;
        document.getElementById('kpiPendingDays').textContent = totalPendingDays;
        document.getElementById('kpiOnLeave').textContent = onLeave;
    }

    function renderTable() {
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No se encontraron registros.</td></tr>';
            return;
        }

        filteredData.forEach(item => {
            const tr = document.createElement('tr');
            const badgeClass = item.estado === 'ACTIVO' ? 'badge-active' : 'badge-pending';

            tr.innerHTML = `
                <td>${item.ficha}</td>
                <td>${item.nombre}</td>
                <td>${item.unidad}</td>
                <td>${item.empresa}</td>
                <td>${item.diasPendientes}</td>
                <td>${item.periodo}</td>
                <td><span class="badge ${badgeClass}">${item.estado}</span></td>
            `;

            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
