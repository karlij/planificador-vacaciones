<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Vacaciones de Personal</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #4682B4;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .controls {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="file"], select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 4px solid var(--secondary-color);
        }

        .kpi-card h3 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .kpi-card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .table-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-active { background-color: #e6f4ea; color: #137333; }
        .badge-pending { background-color: #feefc3; color: #b06000; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Control y Monitoreo de Vacaciones</h1>
    </header>

    <section class="controls">
        <div class="form-group">
            <label for="fileInput">Cargar Archivo TXT Manual</label>
            <input type="file" id="fileInput" accept=".txt" onchange="handleFileUpload(event)">
        </div>

        <div class="form-group">
            <label for="searchInput">Buscar Trabajador / Ficha</label>
            <input type="text" id="searchInput" placeholder="Escriba para filtrar..." oninput="filterData()">
        </div>

        <div class="form-group">
            <label for="statusFilter">Estado</label>
            <select id="statusFilter" onchange="filterData()">
                <option value="ALL">Todos</option>
                <option value="ACTIVO">Activos</option>
                <option value="PENDIENTE">Pendientes</option>
            </select>
        </div>
    </section>

    <section class="kpi-container">
        <div class="kpi-card">
            <h3>Total Trabajadores</h3>
            <p id="kpiTotal">0</p>
        </div>
        <div class="kpi-card">
            <h3>Días Pendientes Totales</h3>
            <p id="kpiPendingDays">0</p>
        </div>
        <div class="kpi-card">
            <h3>Personal de Vacaciones</h3>
            <p id="kpiOnLeave">0</p>
        </div>
    </section>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Ficha</th>
                    <th>Nombre y Apellido</th>
                    <th>Cargo</th>
                    <th>Días Pendientes</th>
                    <th>Último Periodo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <tr>
                    <td colspan="6" style="text-align: center;">Cargando datos...</td>
                </tr>
            </tbody>
        </table>
    </section>
</div>

<script>
    let rawData = [];
    let filteredData = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadTxtData();
    });

    async function loadTxtData() {
        let loaded = false;
        // Se coloca 'vacaciones_personal.txt' en primer orden coincidiendo exactamente con la carpeta local
        const urlsToTry = ['vacaciones_personal.txt', 'Vacaciones%20personal.txt', 'Vacaciones personal.txt'];
        
        for (let url of urlsToTry) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const text = await response.text();
                    if (text.trim().length > 0) {
                        parseTxtData(text);
                        loaded = true;
                        break;
                    }
                }
            } catch (e) {
                console.warn("No se pudo cargar de forma automática desde URL:", url);
            }
        }

        if (!loaded) {
            console.warn("Políticas de seguridad del navegador impiden fetch() en file:///. Use la carga manual si es necesario.");
            document.getElementById('dataTableBody').innerHTML = 
                '<tr><td colspan="6" style="text-align: center; color: #666;">Seleccione el archivo TXT mediante el botón superior para visualizar la información.</td></tr>';
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            parseTxtData(text);
        };
        reader.readAsText(file);
    }

    function parseTxtData(text) {
        const lines = text.split('\n');
        rawData = [];

        lines.forEach((line, index) => {
            const trimmed = line.trim();
            if (!trimmed || index === 0 && (trimmed.toLowerCase().includes('ficha') || trimmed.toLowerCase().includes('nombre'))) {
                return; // Omitir cabeceras o líneas vacías
            }

            // Separación por tabulación, coma o punto y coma
            const columns = trimmed.split(/[\t;,]+/);

            if (columns.length >= 3) {
                rawData.push({
                    ficha: columns[0] ? columns[0].trim() : 'N/A',
                    nombre: columns[1] ? columns[1].trim() : 'N/A',
                    cargo: columns[2] ? columns[2].trim() : 'N/A',
                    diasPendientes: columns[3] ? parseInt(columns[3].trim(), 10) || 0 : 0,
                    periodo: columns[4] ? columns[4].trim() : 'N/A',
                    estado: columns[5] ? columns[5].trim().toUpperCase() : 'ACTIVO'
                });
            }
        });

        filteredData = [...rawData];
        renderAll();
    }

    function filterData() {
        const searchValue = document.getElementById('searchInput').value.toLowerCase();
        const statusValue = document.getElementById('statusFilter').value;

        filteredData = rawData.filter(item => {
            const matchesSearch = item.nombre.toLowerCase().includes(searchValue) || 
                                  item.ficha.toLowerCase().includes(searchValue) ||
                                  item.cargo.toLowerCase().includes(searchValue);
            
            const matchesStatus = (statusValue === 'ALL') || (item.estado === statusValue);

            return matchesSearch && matchesStatus;
        });

        renderAll();
    }

    function renderAll() {
        renderKPIs();
        renderTable();
    }

    function renderKPIs() {
        const total = filteredData.length;
        const totalPendingDays = filteredData.reduce((acc, curr) => acc + curr.diasPendientes, 0);
        const onLeave = filteredData.filter(item => item.estado === 'VACACIONES' || item.estado === 'INACTIVO').length;

        document.getElementById('kpiTotal').textContent = total;
        document.getElementById('kpiPendingDays').textContent = totalPendingDays;
        document.getElementById('kpiOnLeave').textContent = onLeave;
    }

    function renderTable() {
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No se encontraron registros.</td></tr>';
            return;
        }

        filteredData.forEach(item => {
            const tr = document.createElement('tr');

            const badgeClass = item.estado === 'ACTIVO' ? 'badge-active' : 'badge-pending';

            tr.innerHTML = `
                <td>${item.ficha}</td>
                <td>${item.nombre}</td>
                <td>${item.cargo}</td>
                <td>${item.diasPendientes}</td>
                <td>${item.periodo}</td>
                <td><span class="badge ${badgeClass}">${item.estado}</span></td>
            `;

            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
