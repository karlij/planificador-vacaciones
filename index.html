<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Vacaciones Campo Cariña (2026 - 2027)</title>
    <!-- Chart.js & Adaptador de Fechas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header img {
            height: 60px;
            width: auto;
            background-color: white;
            padding: 5px;
            border-radius: 6px;
            object-fit: contain;
        }

        .header-text h1 { margin: 0 0 4px 0; font-size: 24px; }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        select, input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            position: relative;
            height: 680px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 500px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        .tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .tag-2026 { background: #dbeafe; color: #1e40af; }
        .tag-2027 { background: #dcfce7; color: #166534; }

        footer {
            margin-top: 30px;
            padding: 15px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid var(--border);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo Empresa" onerror="this.style.display='none'">
        <div class="header-text">
            <h1>Planificador de Vacaciones Mantenimiento Operacional Campo Cariña (2026 - 2027) rev. oct. 2026</h1>
        </div>
    </div>

    <!-- Filtros de Búsqueda -->
    <div class="controls">
        <div class="form-group">
            <label>Filtrar por Mes</label>
            <select id="filterMonth" onchange="renderAll()">
                <option value="ALL">Todos los Meses</option>
                <option value="01">Enero</option>
                <option value="02">Febrero</option>
                <option value="03">Marzo</option>
                <option value="04">Abril</option>
                <option value="05">Mayo</option>
                <option value="06">Junio</option>
                <option value="07">Julio</option>
                <option value="08">Agosto</option>
                <option value="09">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
        </div>

        <div class="form-group">
            <label>Filtrar por Año</label>
            <select id="filterYear" onchange="renderAll()">
                <option value="ALL">Todos (2026 y 2027)</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
            </select>
        </div>
        <div class="form-group">
            <label>Disciplina / Área</label>
            <select id="filterDisciplina" onchange="renderAll()">
                <option value="ALL">Todas</option>
                <option value="ELECTRICIDAD">Electricidad</option>
                <option value="FACILIDADES">Facilidades</option>
                <option value="INSTRUMENTACIÓN">Instrumentación</option>
                <option value="MECANICA">Mecánica</option>
                <option value="ESTACIONES">Estaciones</option>
                <option value="POZOS">Pozos</option>
            </select>
        </div>
        <div class="form-group">
            <label>Buscar Trabajador</label>
            <input type="text" id="filterSearch" placeholder="Nombre o Cédula..." oninput="renderAll()">
        </div>
    </div>

    <div class="chart-container">
        <canvas id="ganttChart"></canvas>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Cédula</th>
                    <th>Trabajador</th>
                    <th>Disciplina / Área</th>
                    <th>Guardia</th>
                    <th>Año</th>
                    <th>Días Cont.</th>
                    <th>Fecha Inicio</th>
                    <th>Feriados en Período</th>
                    <th>Fecha Fin</th>
                    <th>Reincorporación</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <footer>
        Desarrollado por Ing. Karli Jiménez
    </footer>

    <script>
        const feriados = [
            '2026-01-01', '2026-02-16', '2026-02-17', '2026-04-02', '2026-04-03', '2026-04-19', 
            '2026-05-01', '2026-06-24', '2026-07-05', '2026-07-24', '2026-10-12', '2026-12-24', 
            '2026-12-25', '2026-12-31',
            '2027-01-01', '2027-02-08', '2027-02-09', '2027-03-25', '2027-03-26', '2027-04-19', 
            '2027-05-01', '2027-06-24', '2027-07-05', '2027-07-24', '2027-10-12', '2027-12-24', 
            '2027-12-25', '2027-12-31', '2028-01-01'
        ];

        let rawData = [];
        let chartInstance = null;

        function parseDateToISO(dateStr) {
            if (!dateStr || !dateStr.trim()) return '';
            const parts = dateStr.trim().split('/');
            if (parts.length !== 3) return '';
            const day = parts[0].padStart(2, '0');
            const month = parts[1].padStart(2, '0');
            const year = parts[2];
            return `${year}-${month}-${day}`;
        }

        async function loadTxtData() {
            let loaded = false;
            // Intentar cargar por fetch la versión sin espacios ni caracteres especiales
            const urlsToTry = ['Vacaciones%20personal.txt', 'Vacaciones personal.txt', 'vacaciones_personal.txt'];
            
            for (let url of urlsToTry) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const text = await response.text();
                        if (text.trim().length > 0) {
                            parseTxtData(text);
                            loaded = true;
                            break;
                        }
                    }
                } catch (e) {
                    console.warn("No se pudo cargar desde URL:", url);
                }
            }

            // Si por política del navegador no carga el archivo txt externo, inicializar con estructura segura
            if (!loaded || rawData.length === 0) {
                console.log("Cargando vista inicial predeterminada...");
                renderAll();
            } else {
                renderAll();
            }
        }

        function parseTxtData(txtContent) {
            const lines = txtContent.split(/\r?\n/);
            if (lines.length < 2) return;

            // Detectar si el separador es TAB (\t) o coma (,)
            const sep = lines[0].includes('\t') ? '\t' : ',';
            const headers = lines[0].split(sep).map(h => h.trim().toUpperCase());

            const idxItem = headers.indexOf('ITEM');
            const idxCedula = headers.indexOf('CEDULA');
            const idxNombre = headers.indexOf('APELLIDO Y NOMBRE');
            const idxGuardia = headers.indexOf('GUARDIA');
            const idxDias = headers.indexOf('DIAS DE VACACIONES');
            const idxVac2026 = headers.indexOf('VACACIONES 2026');
            const idxVac2027 = headers.indexOf('VACACIONES 2027');
            const idxArea = headers.indexOf('AREA');

            const parsed = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const cols = line.split(sep).map(c => c.trim());

                const itemNum = cols[idxItem] || i;
                const cedula = cols[idxCedula] || '';
                const nombre = cols[idxNombre] || '';
                const guardia = (cols[idxGuardia] || '').toUpperCase();
                const dias = parseInt(cols[idxDias]) || 21;
                const area = (cols[idxArea] || '').toUpperCase();

                const date2026 = parseDateToISO(cols[idxVac2026]);
                const date2027 = parseDateToISO(cols[idxVac2027]);

                if (date2026) {
                    parsed.push({
                        id: itemNum,
                        cedula: cedula,
                        nombre: nombre,
                        disciplina: area,
                        guardia: guardia,
                        dias: dias,
                        ano: 2026,
                        inicio: date2026
                    });
                }

                if (date2027) {
                    parsed.push({
                        id: itemNum,
                        cedula: cedula,
                        nombre: nombre,
                        disciplina: area,
                        guardia: guardia,
                        dias: dias,
                        ano: 2027,
                        inicio: date2027
                    });
                }
            }

            rawData = parsed;
        }

        function calculateVacations(dateStr, days, is5x2) {
            if (!dateStr) return { fin: '', reinc: '', feriadosCount: 0 };
            
            let start = new Date(dateStr + 'T00:00:00');
            let feriadosEncontrados = 0;

            let end = new Date(start);
            end.setDate(end.getDate() + (days - 1));

            let curr = new Date(start);
            while (curr <= end) {
                let isoStr = curr.toISOString().split('T')[0];
                if (feriados.includes(isoStr)) {
                    feriadosEncontrados++;
                }
                curr.setDate(curr.getDate() + 1);
            }

            let reinc = new Date(end);
            reinc.setDate(reinc.getDate() + 1);

            while (
                (is5x2 && (reinc.getDay() === 0 || reinc.getDay() === 6)) || 
                feriados.includes(reinc.toISOString().split('T')[0])
            ) {
                reinc.setDate(reinc.getDate() + 1);
            }

            return {
                fin: end.toISOString().split('T')[0],
                reinc: reinc.toISOString().split('T')[0],
                feriadosCount: feriadosEncontrados
            };
        }

        function calculateAllData() {
            return rawData.map((item, idx) => {
                let is5x2 = item.guardia === '5X2';
                let calc = calculateVacations(item.inicio, item.dias, is5x2);
                return {
                    ...item,
                    index: idx,
                    fin: calc.fin,
                    reinc: calc.reinc,
                    feriadosCount: calc.feriadosCount
                };
            });
        }

        function renderAll() {
            const data = calculateAllData();
            const yearFilter = document.getElementById('filterYear').value;
            const monthFilter = document.getElementById('filterMonth').value;
            const discFilter = document.getElementById('filterDisciplina').value;
            const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

            const filtered = data.filter(d => {
                if (yearFilter !== 'ALL' && d.ano.toString() !== yearFilter) return false;
                if (discFilter !== 'ALL' && !d.disciplina.includes(discFilter)) return false;
                if (searchFilter && !d.nombre.toLowerCase().includes(searchFilter) && !d.cedula.toLowerCase().includes(searchFilter)) return false;

                if (monthFilter !== 'ALL') {
                    if (!d.inicio || !d.fin) return false;
                    let start = new Date(d.inicio + 'T00:00:00');
                    let end = new Date(d.fin + 'T00:00:00');
                    let targetMonth = parseInt(monthFilter) - 1;

                    let overlapsMonth = false;
                    let curr = new Date(start);
                    while (curr <= end) {
                        if (curr.getMonth() === targetMonth) {
                            overlapsMonth = true;
                            break;
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                    if (!overlapsMonth) return false;
                }

                return true;
            });

            renderTable(filtered);
            renderChart(filtered, yearFilter, monthFilter);
        }

        function renderTable(list) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 20px; color: #64748b;">No se encontraron registros. Por favor verifique el archivo 'Vacaciones personal.txt' en el repositorio.</td></tr>`;
                return;
            }

            list.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.cedula}</td>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.disciplina}</td>
                    <td>${item.guardia}</td>
                    <td><span class="tag tag-${item.ano}">${item.ano}</span></td>
                    <td>${item.dias}</td>
                    <td>${item.inicio}</td>
                    <td>${item.feriadosCount} feriado(s)</td>
                    <td><strong>${item.fin}</strong></td>
                    <td><strong style="color: #15803d;">${item.reinc}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart(list, yearFilter, monthFilter) {
            const ctx = document.getElementById('ganttChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            let sortedList = [...list].sort((a, b) => new Date(a.inicio) - new Date(b.inicio));

            let minX = '2026-01-01';
            let maxX = '2027-12-31';
            let timeUnit = 'month';
            let displayFormat = 'MMM yyyy';

            if (monthFilter !== 'ALL') {
                timeUnit = 'day';
                displayFormat = 'dd MMM';
                let year = yearFilter !== 'ALL' ? parseInt(yearFilter) : 2026;
                let monthIdx = parseInt(monthFilter) - 1;

                let firstDay = new Date(year, monthIdx, 1);
                let lastDay = new Date(year, monthIdx + 1, 0);

                minX = firstDay.toISOString().split('T')[0];
                maxX = lastDay.toISOString().split('T')[0];
            } else {
                if (yearFilter === '2026') {
                    minX = '2026-01-01';
                    maxX = '2026-12-31';
                } else if (yearFilter === '2027') {
                    minX = '2027-01-01';
                    maxX = '2027-12-31';
                }
            }

            const chartData = sortedList.filter(d => d.inicio && d.fin).map(d => ({
                x: [d.inicio, d.fin],
                y: `${d.nombre} (${d.ano})`,
                ano: d.ano
            }));

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    datasets: [{
                        label: 'Período Vacacional',
                        data: chartData,
                        backgroundColor: chartData.map(d => d.ano === 2026 ? 'rgba(59, 130, 246, 0.75)' : 'rgba(34, 197, 94, 0.75)'),
                        borderColor: chartData.map(d => d.ano === 2026 ? '#1d4ed8' : '#15803d'),
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeUnit,
                                displayFormats: { 
                                    day: displayFormat,
                                    month: displayFormat 
                                }
                            },
                            min: minX,
                            max: maxX,
                            title: { display: true, text: monthFilter !== 'ALL' ? 'Días del Mes' : 'Línea del Tiempo' }
                        },
                        y: {
                            ticks: { font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let raw = context.raw;
                                    return `Período: ${raw.x[0]} al ${raw.x[1]}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = loadTxtData;
    </script>
</body>
</html>
