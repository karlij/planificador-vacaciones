            --border: #e2e8f0;
        }

        body {

            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header img {
            height: 60px;
            width: auto;
            background-color: white;
            padding: 5px;
            border-radius: 6px;
            object-fit: contain;
        }

        .header-text h1 { margin: 0 0 4px 0; font-size: 24px; }
        .header-text p { margin: 0; opacity: 0.9; font-size: 14px; }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        select, input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            position: relative;
            height: 680px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 500px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        .tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .tag-2026 { background: #dbeafe; color: #1e40af; }
        .tag-2027 { background: #dcfce7; color: #166534; }

        let chartInstance = null;

        function addDays(dateStr, days, is5x2) {
            if (!dateStr) return { fin: '', reinc: '', feriadosCount: 0 };
            let curr = new Date(dateStr + 'T00:00:00');
            let added = 0;
            let feriadosEncontrados = 0;

            while (added < days) {
                let dayOfWeek = curr.getDay(); // 0: Dom, 6: Sáb
                let isoStr = curr.toISOString().split('T')[0];

                if (feriados.includes(isoStr)) {
                    feriadosEncontrados++;
                } else if (!is5x2 || (dayOfWeek !== 0 && dayOfWeek !== 6)) {
                    added++;
                }
                if (added < days) {
                    curr.setDate(curr.getDate() + 1);
                }
            }

            let finStr = curr.toISOString().split('T')[0];

            let reinc = new Date(curr);
            reinc.setDate(reinc.getDate() + 1);
            while ((is5x2 && (reinc.getDay() === 0 || reinc.getDay() === 6)) || feriados.includes(reinc.toISOString().split('T')[0])) {
                reinc.setDate(reinc.getDate() + 1);
            }

            return {
                fin: finStr,
                reinc: reinc.toISOString().split('T')[0],
                feriadosCount: feriadosEncontrados
            };
        }

        function calculateAllData() {
            return rawData.map((item, idx) => {
                let is5x2 = item.guardia === '5X2';
                let calc = addDays(item.inicio, item.dias, is5x2);
                return {
                    ...item,
                    index: idx,
                    fin: calc.fin,
                    reinc: calc.reinc,
                    feriadosCount: calc.feriadosCount
                };
            });
        }

        function renderAll() {
            const data = calculateAllData();
            const yearFilter = document.getElementById('filterYear').value;
            const monthFilter = document.getElementById('filterMonth').value;
            const discFilter = document.getElementById('filterDisciplina').value;
            const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

            const filtered = data.filter(d => {
                if (yearFilter !== 'ALL' && d.ano.toString() !== yearFilter) return false;
                if (discFilter !== 'ALL' && d.disciplina !== discFilter) return false;
                if (searchFilter && !d.nombre.toLowerCase().includes(searchFilter) && !d.cedula.toLowerCase().includes(searchFilter)) return false;

                // Filtro por Mes
                if (monthFilter !== 'ALL') {
                    if (!d.inicio || !d.fin) return false;
                    let start = new Date(d.inicio + 'T00:00:00');
                    let end = new Date(d.fin + 'T00:00:00');
                    let targetMonth = parseInt(monthFilter) - 1;

                    let overlapsMonth = false;
                    let curr = new Date(start);
                    while (curr <= end) {
                        if (curr.getMonth() === targetMonth) {
                            overlapsMonth = true;
                            break;
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                    if (!overlapsMonth) return false;
                }

                return true;
            });

            renderTable(filtered);
            renderChart(filtered, yearFilter);
        }

        function renderTable(list) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            list.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.cedula}</td>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.disciplina}</td>
                    <td>${item.guardia}</td>
                    <td><span class="tag tag-${item.ano}">${item.ano}</span></td>
                    <td>${item.dias}</td>
                    <td>${item.inicio}</td>
                    <td>${item.feriadosCount} feriado(s)</td>
                    <td><strong>${item.fin}</strong></td>
                    <td><strong style="color: #15803d;">${item.reinc}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart(list, yearFilter) {
            const ctx = document.getElementById('ganttChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            let minX = '2026-01-01';
            let maxX = '2027-12-31';

            if (yearFilter === '2026') {
                minX = '2026-01-01';
                maxX = '2026-12-31';
            } else if (yearFilter === '2027') {
                minX = '2027-01-01';
                maxX = '2027-12-31';
            }

            const chartData = list.filter(d => d.inicio && d.fin).map(d => ({
                x: [d.inicio, d.fin],
                y: `${d.nombre} (${d.ano})`,
                ano: d.ano
            }));

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    datasets: [{
                        label: 'Período Vacacional',
                        data: chartData,
                        backgroundColor: chartData.map(d => d.ano === 2026 ? 'rgba(59, 130, 246, 0.75)' : 'rgba(34, 197, 94, 0.75)'),
                        borderColor: chartData.map(d => d.ano === 2026 ? '#1d4ed8' : '#15803d'),
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'month',
                                displayFormats: { month: 'MMM yyyy' }
                            },
                            min: minX,
                            max: maxX,
                            title: { display: true, text: 'Línea del Tiempo (2026 - 2027)' }
                        },
                        y: {
                            ticks: { font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let raw = context.raw;
                                    return `Período: ${raw.x[0]} al ${raw.x[1]}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = renderAll;
    </script>
</body>
</html>
