<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Vacaciones Campo Cariña (2026 - 2027)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header img {
            height: 60px;
            width: auto;
            background-color: white;
            padding: 5px;
            border-radius: 6px;
            object-fit: contain;
        }

        .header-text h1 { margin: 0 0 4px 0; font-size: 22px; }

        /* Estilo para la barra de resumen de filtros activos */
        .active-filters-banner {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .active-filters-banner strong {
            color: #1e3a8a;
        }

        .filter-tag {
            background: #dbeafe;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        select, input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .btn-pdf {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pdf:hover {
            background-color: #b91c1c;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            max-height: 650px;
            overflow-y: auto;
            position: relative;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            min-height: 400px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 500px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        .tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .tag-2026 { background: #dbeafe; color: #1e40af; }
        .tag-2027 { background: #dcfce7; color: #166534; }

        /* Footer institucional */
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid var(--border);
            margin-top: 20px;
        }

        /* ==========================================
           REGLAS DE IMPRESIÓN / PDF PERFECTAS
           ========================================== */
        @media print {
            @page {
                size: letter landscape;
                margin: 10mm;
            }

            body {
                background-color: white !important;
                padding: 0 !important;
                color: black !important;
            }

            .controls {
                display: none !important;
            }

            .header {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                background-color: #1e3a8a !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin-bottom: 8px;
            }

            .active-filters-banner {
                background-color: #f8fafc !important;
                border: 1px solid #cbd5e1 !important;
                color: #0f172a !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin-bottom: 10px;
                padding: 6px 10px;
            }

            .chart-container, .table-container {
                max-height: none !important;
                overflow: visible !important;
                height: auto !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin-bottom: 15px;
            }

            table {
                width: 100% !important;
                font-size: 9px !important;
            }

            th, td {
                padding: 4px 6px !important;
                white-space: nowrap !important;
            }

            th {
                position: static !important;
                background-color: #e2e8f0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .footer {
                border-top: 1px solid #ccc !important;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo Empresa" onerror="this.style.display='none'">
        <div class="header-text">
            <h1>Cronograma de Vacaciones Gerencia de Operaciones (2026 - 2027)</h1>
        </div>
    </div>

    <!-- Banner que muestra los filtros aplicados -->
    <div class="active-filters-banner" id="activeFiltersBanner">
        <span>🔍 <strong>Filtros Aplicados:</strong> Cargando...</span>
    </div>

    <div class="controls">
        <div class="form-group">
            <label>Unidad</label>
            <select id="filterUnidad" onchange="renderAll()"><option value="ALL">Todas las Unidades</option></select>
        </div>

        <div class="form-group">
            <label>Área</label>
            <select id="filterArea" onchange="renderAll()"><option value="ALL">Todas las Áreas</option></select>
        </div>

        <div class="form-group">
            <label>Ubicación</label>
            <select id="filterUbicacion" onchange="renderAll()"><option value="ALL">Todas las Ubicaciones</option></select>
        </div>

        <div class="form-group">
            <label>Filtrar por Mes</label>
            <select id="filterMonth" onchange="renderAll()">
                <option value="ALL">Todos los Meses</option>
                <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
                <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
                <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option>
                <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
        </div>

        <div class="form-group">
            <label>Filtrar por Año</label>
            <select id="filterYear" onchange="renderAll()">
                <option value="ALL">Todos (2026 y 2027)</option>
                <option value="2026">2026</option><option value="2027">2027</option>
            </select>
        </div>

        <div class="form-group">
            <label>Guardia</label>
            <select id="filterGuardia" onchange="renderAll()"><option value="ALL">Todas las Guardias</option></select>
        </div>

        <div class="form-group">
            <label>Buscar Trabajador</label>
            <input type="text" id="filterSearch" placeholder="Nombre o Cédula..." oninput="renderAll()">
        </div>

        <div class="form-group">
            <button class="btn-pdf" onclick="window.print()">
                📄 Exportar a PDF (Carta)
            </button>
        </div>
    </div>

    <div class="chart-container">
        <div id="chartWrapper" class="chart-wrapper">
            <canvas id="ganttChart"></canvas>
        </div>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Unidad / Área</th>
                    <th>Nómina</th>
                    <th>Cédula</th>
                    <th>Trabajador</th>
                    <th>Rol</th>
                    <th>Ubicación</th>
                    <th>Guardia</th>
                    <th>Días Vac.</th>
                    <th>Año</th>
                    <th>Fecha Inicio</th>
                    <th>Feriados</th>
                    <th>Fecha Fin</th>
                    <th>Reincorporación</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer">
        © 2026 — Desarrollado por Ing. Karli Jiménez
    </div>

    <script>
        const feriados = [
            '2026-01-01', '2026-02-16', '2026-02-17', '2026-04-02', '2026-04-03', '2026-04-19', 
            '2026-05-01', '2026-06-24', '2026-07-05', '2026-07-24', '2026-10-12', '2026-12-24', 
            '2026-12-25', '2026-12-31',
            '2027-01-01', '2027-02-08', '2027-02-09', '2027-03-25', '2027-03-26', '2027-04-19', 
            '2027-05-01', '2027-06-24', '2027-07-05', '2027-07-24', '2027-10-12', '2027-12-24', 
            '2027-12-25', '2027-12-31', '2028-01-01'
        ];

        let rawSource = [];
        let chartInstance = null;

        async function loadCSVAutomatic() {
            try {
                const response = await fetch('vacaciones personal produccion.csv');
                if (!response.ok) throw new Error('No se pudo cargar el archivo CSV');
                
                const text = await response.text();
                parseCSV(text);
            } catch (error) {
                console.error('Error al cargar el archivo CSV automáticamente:', error);
            }
        }

        function initFilterOptions() {
            const unidadSelect = document.getElementById('filterUnidad');
            const areaSelect = document.getElementById('filterArea');
            const ubicacionSelect = document.getElementById('filterUbicacion');
            const guardiaSelect = document.getElementById('filterGuardia');

            unidadSelect.innerHTML = '<option value="ALL">Todas las Unidades</option>';
            areaSelect.innerHTML = '<option value="ALL">Todas las Áreas</option>';
            ubicacionSelect.innerHTML = '<option value="ALL">Todas las Ubicaciones</option>';
            guardiaSelect.innerHTML = '<option value="ALL">Todas las Guardias</option>';

            const uniqueUnidades = [...new Set(rawSource.map(item => item.unidad))].sort();
            const uniqueAreas = [...new Set(rawSource.map(item => item.area))].sort();
            const uniqueUbicaciones = [...new Set(rawSource.map(item => item.ubicacion))].sort();
            const uniqueGuardias = [...new Set(rawSource.map(item => item.guardia))].sort();

            uniqueUnidades.forEach(val => {
                let opt = document.createElement('option');
                opt.value = val; opt.textContent = val;
                unidadSelect.appendChild(opt);
            });

            uniqueAreas.forEach(val => {
                let opt = document.createElement('option');
                opt.value = val; opt.textContent = val;
                areaSelect.appendChild(opt);
            });

            uniqueUbicaciones.forEach(val => {
                let opt = document.createElement('option');
                opt.value = val; opt.textContent = val;
                ubicacionSelect.appendChild(opt);
            });

            uniqueGuardias.forEach(val => {
                let opt = document.createElement('option');
                opt.value = val; opt.textContent = val;
                guardiaSelect.appendChild(opt);
            });
        }

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;

            const header = lines[0];
            const delimiter = header.includes(';') ? ';' : ',';

            let newSource = [];
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let cols = line.split(delimiter);
                if (cols.length >= 11) {
                    let grupo = cols[3] ? cols[3].trim() : '';
                    let nominaBase = cols[4] ? cols[4].trim() : '';
                    let nominaFull = grupo ? `${grupo} ${nominaBase}` : nominaBase;

                    newSource.push({
                        id: parseInt(cols[0]) || i,
                        unidad: cols[1] ? cols[1].trim() : '',
                        area: cols[2] ? cols[2].trim() : '',
                        nomina: nominaFull,
                        cedula: cols[5] ? cols[5].trim() : '',
                        nombre: cols[6] ? cols[6].trim() : '',
                        rol: cols[7] ? cols[7].trim() : '',
                        ubicacion: cols[8] ? cols[8].trim() : '',
                        guardia: cols[9] ? cols[9].trim() : '',
                        dias: parseInt(cols[10]) || 21,
                        v2026: cols[11] ? cols[11].trim() : '',
                        v2027: cols[12] ? cols[12].trim() : ''
                    });
                }
            }

            if (newSource.length > 0) {
                rawSource = newSource;
                initFilterOptions();
                renderAll();
            }
        }

        function calculateVacations(dateStr, days, is5x2) {
            if (!dateStr) return { fin: '', reinc: '', feriadosCount: 0 };

            let start = new Date(dateStr + 'T00:00:00');
            let feriadosEncontrados = 0;

            let end = new Date(start);
            end.setDate(end.getDate() + (days - 1));

            let curr = new Date(start);
            while (curr <= end) {
                let isoStr = curr.toISOString().split('T')[0];
                if (feriados.includes(isoStr)) {
                    feriadosEncontrados++;
                }
                curr.setDate(curr.getDate() + 1);
            }

            let reinc = new Date(end);
            reinc.setDate(reinc.getDate() + 1);

            while (
                (is5x2 && (reinc.getDay() === 0 || reinc.getDay() === 6)) || 
                feriados.includes(reinc.toISOString().split('T')[0])
            ) {
                reinc.setDate(reinc.getDate() + 1);
            }

            return {
                fin: end.toISOString().split('T')[0],
                reinc: reinc.toISOString().split('T')[0],
                feriadosCount: feriadosEncontrados
            };
        }

        function calculateAllData() {
            let processed = [];
            rawSource.forEach(item => {
                let is5x2 = item.guardia.toLowerCase().includes('5x2');

                if (item.v2026) {
                    let calc2026 = calculateVacations(item.v2026, item.dias, is5x2);
                    processed.push({
                        ...item,
                        ano: 2026,
                        inicio: item.v2026,
                        fin: calc2026.fin,
                        reinc: calc2026.reinc,
                        feriadosCount: calc2026.feriadosCount
                    });
                }

                if (item.v2027) {
                    let calc2027 = calculateVacations(item.v2027, item.dias, is5x2);
                    processed.push({
                        ...item,
                        ano: 2027,
                        inicio: item.v2027,
                        fin: calc2027.fin,
                        reinc: calc2027.reinc,
                        feriadosCount: calc2027.feriadosCount
                    });
                }
            });
            return processed;
        }

        function updateFilterBanner(unidad, area, ubicacion, month, year, guardia, search) {
            const banner = document.getElementById('activeFiltersBanner');
            const monthNames = {
                'ALL': 'Todos', '01': 'Enero', '02': 'Febrero', '03': 'Marzo',
                '04': 'Abril', '05': 'Mayo', '06': 'Junio', '07': 'Julio',
                '08': 'Agosto', '09': 'Septiembre', '10': 'Octubre',
                '11': 'Noviembre', '12': 'Diciembre'
            };

            banner.innerHTML = `
                <span>🔍 <strong>Filtros Aplicados:</strong></span>
                <span>Unidad: <span class="filter-tag">${unidad}</span></span>
                <span>Área: <span class="filter-tag">${area}</span></span>
                <span>Ubicación: <span class="filter-tag">${ubicacion}</span></span>
                <span>Mes: <span class="filter-tag">${monthNames[month] || month}</span></span>
                <span>Año: <span class="filter-tag">${year}</span></span>
                <span>Guardia: <span class="filter-tag">${guardia}</span></span>
                ${search ? `<span>Búsqueda: <span class="filter-tag">"${search}"</span></span>` : ''}
            `;
        }

        function renderAll() {
            const unidadFilter = document.getElementById('filterUnidad').value;
            const areaFilter = document.getElementById('filterArea').value;
            const ubicacionFilter = document.getElementById('filterUbicacion').value;
            const yearFilter = document.getElementById('filterYear').value;
            const monthFilter = document.getElementById('filterMonth').value;
            const guardiaFilter = document.getElementById('filterGuardia').value;
            const searchFilter = document.getElementById('filterSearch').value.trim();

            updateFilterBanner(unidadFilter, areaFilter, ubicacionFilter, monthFilter, yearFilter, guardiaFilter, searchFilter);

            const data = calculateAllData();
            const filtered = data.filter(d => {
                if (unidadFilter !== 'ALL' && d.unidad !== unidadFilter) return false;
                if (areaFilter !== 'ALL' && d.area !== areaFilter) return false;
                if (ubicacionFilter !== 'ALL' && d.ubicacion !== ubicacionFilter) return false;
                if (yearFilter !== 'ALL' && d.ano.toString() !== yearFilter) return false;
                if (guardiaFilter !== 'ALL' && d.guardia.toUpperCase() !== guardiaFilter.toUpperCase()) return false;
                if (searchFilter && !d.nombre.toLowerCase().includes(searchFilter.toLowerCase()) && !d.cedula.toLowerCase().includes(searchFilter.toLowerCase())) return false;

                if (monthFilter !== 'ALL') {
                    if (!d.inicio || !d.fin) return false;
                    let start = new Date(d.inicio + 'T00:00:00');
                    let end = new Date(d.fin + 'T00:00:00');
                    let targetMonth = parseInt(monthFilter) - 1;

                    let overlapsMonth = false;
                    let curr = new Date(start);
                    while (curr <= end) {
                        if (curr.getMonth() === targetMonth) {
                            overlapsMonth = true;
                            break;
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                    if (!overlapsMonth) return false;
                }

                return true;
            });

            renderTable(filtered);
            renderChart(filtered, yearFilter, monthFilter);
        }

        function renderTable(list) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            list.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td><strong>${item.unidad}</strong><br><small style="color:#64748b">${item.area}</small></td>
                    <td>${item.nomina}</td>
                    <td>${item.cedula || 'N/A'}</td>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.rol}</td>
                    <td>${item.ubicacion}</td>
                    <td>${item.guardia}</td>
                    <td>${item.dias}</td>
                    <td><span class="tag tag-${item.ano}">${item.ano}</span></td>
                    <td>${item.inicio}</td>
                    <td>${item.feriadosCount} feriado(s)</td>
                    <td><strong>${item.fin}</strong></td>
                    <td><strong style="color: #15803d;">${item.reinc}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart(list, yearFilter, monthFilter) {
            const ctx = document.getElementById('ganttChart').getContext('2d');
            const wrapper = document.getElementById('chartWrapper');

            if (chartInstance) chartInstance.destroy();

            const chartData = list.filter(d => d.inicio && d.fin).map(d => ({
                x: [d.inicio, d.fin],
                y: `${d.nombre} (${d.ano})`,
                ano: d.ano
            }));

            const dynamicHeight = Math.max(400, chartData.length * 28);
            wrapper.style.height = `${dynamicHeight}px`;

            let minX = '2026-01-01';
            let maxX = '2027-12-31';
            let timeUnit = 'month';
            let displayFormat = { month: 'MMM yyyy' };

            if (monthFilter !== 'ALL') {
                timeUnit = 'day';
                displayFormat = { day: 'dd MMM' };

                let targetYear = (yearFilter !== 'ALL') ? parseInt(yearFilter) : 2027;
                let targetMonthInt = parseInt(monthFilter);

                let startOfMonth = new Date(targetYear, targetMonthInt - 1, 1);
                let endOfMonth = new Date(targetYear, targetMonthInt, 0);

                minX = startOfMonth.toISOString().split('T')[0];
                maxX = endOfMonth.toISOString().split('T')[0];
            } else if (yearFilter === '2026') {
                minX = '2026-01-01';
                maxX = '2026-12-31';
            } else if (yearFilter === '2027') {
                minX = '2027-01-01';
                maxX = '2027-12-31';
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    datasets: [{
                        label: 'Período Vacacional',
                        data: chartData,
                        backgroundColor: chartData.map(d => d.ano === 2026 ? 'rgba(59, 130, 246, 0.75)' : 'rgba(34, 197, 94, 0.75)'),
                        borderColor: chartData.map(d => d.ano === 2026 ? '#1d4ed8' : '#15803d'),
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeUnit,
                                stepSize: (timeUnit === 'day') ? 2 : 1,
                                displayFormats: displayFormat
                            },
                            min: minX,
                            max: maxX,
                            title: { display: true, text: monthFilter !== 'ALL' ? 'Días del Mes' : 'Línea del Tiempo' }
                        },
                        y: {
                            ticks: { 
                                autoSkip: false,
                                font: { size: 11 } 
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let raw = context.raw;
                                    return `Período: ${raw.x[0]} al ${raw.x[1]}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = async function() {
            await loadCSVAutomatic();
        };
    </script>
</body>
</html>
