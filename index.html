<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Vacaciones Campo Cariña (2026 - 2027)</title>
    <!-- Chart.js & Adaptador de Fechas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header img {
            height: 60px;
            width: auto;
            background-color: white;
            padding: 5px;
            border-radius: 6px;
            object-fit: contain;
        }

        .header-text h1 { margin: 0 0 4px 0; font-size: 24px; }
        .header-text p { margin: 0; opacity: 0.9; font-size: 14px; }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        select, input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            position: relative;
            height: 680px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 500px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        .tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .tag-2026 { background: #dbeafe; color: #1e40af; }
        .tag-2027 { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo Empresa" onerror="this.style.display='none'">
        <div class="header-text">
            <h1>Planificador de Vacaciones Operacionales Campo Cariña (2026 - 2027)</h1>
        </div>
    </div>

    <!-- Filtros de Búsqueda y Consulta -->
    <div class="controls">
        <div class="form-group">
            <label>Unidad</label>
            <select id="filterUnidad" onchange="renderAll()">
                <option value="ALL">Todas las Unidades</option>
                <option value="PRODUCCION">Producción / Operaciones</option>
                <option value="MANTENIMIENTO">Mantenimiento</option>
            </select>
        </div>

        <div class="form-group">
            <label>Filtrar por Mes</label>
            <select id="filterMonth" onchange="renderAll()">
                <option value="ALL">Todos los Meses</option>
                <option value="01">Enero</option>
                <option value="02">Febrero</option>
                <option value="03">Marzo</option>
                <option value="04">Abril</option>
                <option value="05">Mayo</option>
                <option value="06">Junio</option>
                <option value="07">Julio</option>
                <option value="08">Agosto</option>
                <option value="09">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
        </div>

        <div class="form-group">
            <label>Filtrar por Año</label>
            <select id="filterYear" onchange="renderAll()">
                <option value="ALL">Todos (2026 y 2027)</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
            </select>
        </div>

        <div class="form-group">
            <label>Guardia</label>
            <select id="filterGuardia" onchange="renderAll()">
                <option value="ALL">Todas</option>
                <option value="4X4">4X4</option>
                <option value="5X2">5X2</option>
                <option value="7X7">7X7</option>
                <option value="1X2">1X2</option>
            </select>
        </div>

        <div class="form-group">
            <label>Buscar Trabajador</label>
            <input type="text" id="filterSearch" placeholder="Nombre o Cédula..." oninput="renderAll()">
        </div>
    </div>

    <div class="chart-container">
        <canvas id="ganttChart"></canvas>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Unidad / Área</th>
                    <th>Cédula</th>
                    <th>Trabajador</th>
                    <th>Rol / Especialidad</th>
                    <th>Ubicación</th>
                    <th>Guardia</th>
                    <th>Año</th>
                    <th>Días</th>
                    <th>Fecha Inicio</th>
                    <th>Feriados</th>
                    <th>Fecha Fin</th>
                    <th>Reincorporación</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
