            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

            align-items: center;
            gap: 20px;
        }

        .header img {
            height: 60px;
            width: auto;
            background-color: white;
            padding: 5px;
            border-radius: 6px;
            object-fit: contain;
        }

        .header-text h1 { margin: 0 0 4px 0; font-size: 24px; }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        select, input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            max-height: 650px;
            overflow-y: auto;
            position: relative;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            min-height: 400px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 500px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        .tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        ];

        let chartInstance = null;

        // Inicializar opciones dinámicas de los selects de Área y Ubicación
        function initFilterOptions() {
            const areaSelect = document.getElementById('filterArea');
            const ubicacionSelect = document.getElementById('filterUbicacion');

            const uniqueAreas = [...new Set(rawSource.map(item => item.area))].sort();
            const uniqueUbicaciones = [...new Set(rawSource.map(item => item.ubicacion))].sort();

            uniqueAreas.forEach(area => {
                const opt = document.createElement('option');
                opt.value = area;
                opt.textContent = area;
                areaSelect.appendChild(opt);
            });

            uniqueUbicaciones.forEach(ubicacion => {
                const opt = document.createElement('option');
                opt.value = ubicacion;
                opt.textContent = ubicacion;
                ubicacionSelect.appendChild(opt);
            });
        }

        function calculateVacations(dateStr, days, is5x2) {
            if (!dateStr) return { fin: '', reinc: '', feriadosCount: 0 };
            
            let start = new Date(dateStr + 'T00:00:00');
            let feriadosEncontrados = 0;

            let end = new Date(start);
            end.setDate(end.getDate() + (days - 1));

            let curr = new Date(start);
            while (curr <= end) {
                let isoStr = curr.toISOString().split('T')[0];
                if (feriados.includes(isoStr)) {
                    feriadosEncontrados++;
                }
                curr.setDate(curr.getDate() + 1);
            }

            let reinc = new Date(end);
            reinc.setDate(reinc.getDate() + 1);

            while (
                (is5x2 && (reinc.getDay() === 0 || reinc.getDay() === 6)) || 
                feriados.includes(reinc.toISOString().split('T')[0])
            ) {
                reinc.setDate(reinc.getDate() + 1);
            }

            return {
                fin: end.toISOString().split('T')[0],
                reinc: reinc.toISOString().split('T')[0],
                feriadosCount: feriadosEncontrados
            };
        }

        function calculateAllData() {
            let processed = [];
            rawSource.forEach(item => {
                let is5x2 = item.guardia.toLowerCase() === '5x2';

                if (item.v2026) {
                    let calc2026 = calculateVacations(item.v2026, item.dias, is5x2);
                    processed.push({
                        ...item,
                        ano: 2026,
                        inicio: item.v2026,
                        fin: calc2026.fin,
                        reinc: calc2026.reinc,
                        feriadosCount: calc2026.feriadosCount
                    });
                }

                if (item.v2027) {
                    let calc2027 = calculateVacations(item.v2027, item.dias, is5x2);
                    processed.push({
                        ...item,
                        ano: 2027,
                        inicio: item.v2027,
                        fin: calc2027.fin,
                        reinc: calc2027.reinc,
                        feriadosCount: calc2027.feriadosCount
                    });
                }
            });
            return processed;
        }

        function renderAll() {
            const data = calculateAllData();
            const unidadFilter = document.getElementById('filterUnidad').value;
            const areaFilter = document.getElementById('filterArea').value;
            const ubicacionFilter = document.getElementById('filterUbicacion').value;
            const yearFilter = document.getElementById('filterYear').value;
            const monthFilter = document.getElementById('filterMonth').value;
            const guardiaFilter = document.getElementById('filterGuardia').value;
            const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

            const filtered = data.filter(d => {
                // Filtro por Unidad
                if (unidadFilter !== 'ALL' && d.unidad !== unidadFilter) return false;

                // Filtro por Área
                if (areaFilter !== 'ALL' && d.area !== areaFilter) return false;

                // Filtro por Ubicación
                if (ubicacionFilter !== 'ALL' && d.ubicacion !== ubicacionFilter) return false;
                
                // Filtro por Año
                if (yearFilter !== 'ALL' && d.ano.toString() !== yearFilter) return false;
                
                // Filtro por Guardia
                if (guardiaFilter !== 'ALL' && d.guardia.toLowerCase() !== guardiaFilter.toLowerCase()) return false;
                
                // Búsqueda por Texto
                if (searchFilter && !d.nombre.toLowerCase().includes(searchFilter) && !d.cedula.toLowerCase().includes(searchFilter)) return false;

                // Filtro por Mes
                if (monthFilter !== 'ALL') {
                    if (!d.inicio || !d.fin) return false;
                    let start = new Date(d.inicio + 'T00:00:00');
                    let end = new Date(d.fin + 'T00:00:00');
                    let targetMonth = parseInt(monthFilter) - 1;

                    let overlapsMonth = false;
                    let curr = new Date(start);
                    while (curr <= end) {
                        if (curr.getMonth() === targetMonth) {
                            overlapsMonth = true;
                            break;
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                    if (!overlapsMonth) return false;
                }

                return true;
            });

            renderTable(filtered);
            renderChart(filtered, yearFilter, monthFilter);
        }

        function renderTable(list) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            list.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td><strong>${item.unidad}</strong><br><small style="color:#64748b">${item.area}</small></td>
                    <td>${item.nomina}</td>
                    <td>${item.cedula}</td>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.rol}</td>
                    <td>${item.ubicacion}</td>
                    <td>${item.guardia}</td>
                    <td>${item.dias}</td>
                    <td><span class="tag tag-${item.ano}">${item.ano}</span></td>
                    <td>${item.inicio}</td>
                    <td>${item.feriadosCount} feriado(s)</td>
                    <td><strong>${item.fin}</strong></td>
                    <td><strong style="color: #15803d;">${item.reinc}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart(list, yearFilter, monthFilter) {
            const ctx = document.getElementById('ganttChart').getContext('2d');
            const wrapper = document.getElementById('chartWrapper');

            if (chartInstance) chartInstance.destroy();

            const chartData = list.filter(d => d.inicio && d.fin).map(d => ({
                x: [d.inicio, d.fin],
                y: `${d.nombre} (${d.ano})`,
                ano: d.ano
            }));

            const dynamicHeight = Math.max(400, chartData.length * 28);
            wrapper.style.height = `${dynamicHeight}px`;

            let minX = '2026-01-01';
            let maxX = '2027-12-31';
            let timeUnit = 'month';
            let displayFormat = { month: 'MMM yyyy' };

            if (monthFilter !== 'ALL') {
                timeUnit = 'day';
                displayFormat = { day: 'dd MMM' };

                let targetYear = (yearFilter !== 'ALL') ? parseInt(yearFilter) : 2027;
                let targetMonthInt = parseInt(monthFilter);
                
                let startOfMonth = new Date(targetYear, targetMonthInt - 1, 1);
                let endOfMonth = new Date(targetYear, targetMonthInt, 0);

                minX = startOfMonth.toISOString().split('T')[0];
                maxX = endOfMonth.toISOString().split('T')[0];
            } else if (yearFilter === '2026') {
                minX = '2026-01-01';
                maxX = '2026-12-31';
            } else if (yearFilter === '2027') {
                minX = '2027-01-01';
                maxX = '2027-12-31';
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    datasets: [{
                        label: 'Período Vacacional',
                        data: chartData,
                        backgroundColor: chartData.map(d => d.ano === 2026 ? 'rgba(59, 130, 246, 0.75)' : 'rgba(34, 197, 94, 0.75)'),
                        borderColor: chartData.map(d => d.ano === 2026 ? '#1d4ed8' : '#15803d'),
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeUnit,
                                stepSize: (timeUnit === 'day') ? 2 : 1,
                                displayFormats: displayFormat
                            },
                            min: minX,
                            max: maxX,
                            title: { display: true, text: monthFilter !== 'ALL' ? 'Días del Mes' : 'Línea del Tiempo' }
                        },
                        y: {
                            ticks: { 
                                autoSkip: false,
                                font: { size: 11 } 
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let raw = context.raw;
                                    return `Período: ${raw.x[0]} al ${raw.x[1]}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = function() {
            initFilterOptions();
            renderAll();
        };
    </script>
