        :root {

            --bg: #f8fafc;

            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header img {
            height: 60px;
            width: auto;
            background-color: white;
            padding: 5px;
            border-radius: 6px;
            object-fit: contain;
        }

        .header-text h1 { margin: 0 0 4px 0; font-size: 24px; }
        .header-text p { margin: 0; opacity: 0.9; font-size: 14px; }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
        }

        select, input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            position: relative;
            height: 680px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 500px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        .tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .tag-2026 { background: #dbeafe; color: #1e40af; }
        .tag-2027 { background: #dcfce7; color: #166534; }

        <div class="form-group">
            <label>Buscar Trabajador</label>
            <input type="text" id="filterSearch" placeholder="Nombre o Cédula..." oninput="renderAll()">
        </div>
    </div>

        let chartInstance = null;

        function calculateVacations(dateStr, days, is5x2) {
            if (!dateStr) return { fin: '', reinc: '', feriadosCount: 0 };
            
            let start = new Date(dateStr + 'T00:00:00');
            let feriadosEncontrados = 0;

            let end = new Date(start);
            end.setDate(end.getDate() + (days - 1));

            let curr = new Date(start);
            while (curr <= end) {
                let isoStr = curr.toISOString().split('T')[0];
                if (feriados.includes(isoStr)) {
                    feriadosEncontrados++;
                }
                curr.setDate(curr.getDate() + 1);
            }

            let reinc = new Date(end);
            reinc.setDate(reinc.getDate() + 1);

            while (
                (is5x2 && (reinc.getDay() === 0 || reinc.getDay() === 6)) || 
                feriados.includes(reinc.toISOString().split('T')[0])
            ) {
                reinc.setDate(reinc.getDate() + 1);
            }

            return {
                fin: end.toISOString().split('T')[0],
                reinc: reinc.toISOString().split('T')[0],
                feriadosCount: feriadosEncontrados
            };
        }

        function calculateAllData() {
            return rawData.map((item, idx) => {
                let is5x2 = item.guardia === '5X2';
                let calc = calculateVacations(item.inicio, item.dias, is5x2);
                return {
                    ...item,
                    index: idx,
                    fin: calc.fin,
                    reinc: calc.reinc,
                    feriadosCount: calc.feriadosCount
                };
            });
        }

        function renderAll() {
            const data = calculateAllData();
            const unidadFilter = document.getElementById('filterUnidad').value;
            const yearFilter = document.getElementById('filterYear').value;
            const monthFilter = document.getElementById('filterMonth').value;
            const guardiaFilter = document.getElementById('filterGuardia').value;
            const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

            const filtered = data.filter(d => {
                if (unidadFilter !== 'ALL' && d.unidad !== unidadFilter) return false;
                if (yearFilter !== 'ALL' && d.ano.toString() !== yearFilter) return false;
                if (guardiaFilter !== 'ALL' && d.guardia !== guardiaFilter) return false;
                if (searchFilter && !d.nombre.toLowerCase().includes(searchFilter) && !d.cedula.toLowerCase().includes(searchFilter)) return false;

                // Filtro por Mes
                if (monthFilter !== 'ALL') {
                    if (!d.inicio || !d.fin) return false;
                    let start = new Date(d.inicio + 'T00:00:00');
                    let end = new Date(d.fin + 'T00:00:00');
                    let targetMonth = parseInt(monthFilter) - 1;

                    let overlapsMonth = false;
                    let curr = new Date(start);
                    while (curr <= end) {
                        if (curr.getMonth() === targetMonth) {
                            overlapsMonth = true;
                            break;
                        }
                        curr.setDate(curr.getDate() + 1);
                    }
                    if (!overlapsMonth) return false;
                }

                return true;
            });

            renderTable(filtered);
            renderChart(filtered, yearFilter, monthFilter);
        }

        function renderTable(list) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            list.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td><strong>${item.unidad}</strong><br><small style="color:#64748b">${item.area}</small></td>
                    <td>${item.cedula}</td>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.rol}</td>
                    <td>${item.ubicacion}</td>
                    <td>${item.guardia}</td>
                    <td><span class="tag tag-${item.ano}">${item.ano}</span></td>
                    <td>${item.dias}</td>
                    <td>${item.inicio}</td>
                    <td>${item.feriadosCount} feriado(s)</td>
                    <td><strong>${item.fin}</strong></td>
                    <td><strong style="color: #15803d;">${item.reinc}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderChart(list, yearFilter, monthFilter) {
            const ctx = document.getElementById('ganttChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            let minX = '2026-01-01';
            let maxX = '2027-12-31';
            let timeUnit = 'month';
            let displayFormat = { month: 'MMM yyyy' };

            // Configuración dinámica si se selecciona un mes específico
            if (monthFilter !== 'ALL') {
                timeUnit = 'day';
                displayFormat = { day: 'dd MMM' };

                let targetYear = (yearFilter !== 'ALL') ? parseInt(yearFilter) : 2027;
                let targetMonthInt = parseInt(monthFilter); // 1 - 12
                
                // Mínimo: día 1 del mes seleccionado
                let startOfMonth = new Date(targetYear, targetMonthInt - 1, 1);
                // Máximo: último día del mes seleccionado
                let endOfMonth = new Date(targetYear, targetMonthInt, 0);

                minX = startOfMonth.toISOString().split('T')[0];
                maxX = endOfMonth.toISOString().split('T')[0];
            } else if (yearFilter === '2026') {
                minX = '2026-01-01';
                maxX = '2026-12-31';
            } else if (yearFilter === '2027') {
                minX = '2027-01-01';
                maxX = '2027-12-31';
            }

            const chartData = list.filter(d => d.inicio && d.fin).map(d => ({
                x: [d.inicio, d.fin],
                y: `${d.nombre} (${d.ano})`,
                ano: d.ano
            }));

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    datasets: [{
                        label: 'Período Vacacional',
                        data: chartData,
                        backgroundColor: chartData.map(d => d.ano === 2026 ? 'rgba(59, 130, 246, 0.75)' : 'rgba(34, 197, 94, 0.75)'),
                        borderColor: chartData.map(d => d.ano === 2026 ? '#1d4ed8' : '#15803d'),
                        borderWidth: 1,
                        borderRadius: 4,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeUnit,
                                stepSize: (timeUnit === 'day') ? 2 : 1, // Muestra de 2 en 2 días si es por mes para no saturar
                                displayFormats: displayFormat
                            },
                            min: minX,
                            max: maxX,
                            title: { display: true, text: monthFilter !== 'ALL' ? 'Días del Mes' : 'Línea del Tiempo' }
                        },
                        y: {
                            ticks: { font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let raw = context.raw;
                                    return `Período: ${raw.x[0]} al ${raw.x[1]}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = renderAll;
    </script>
